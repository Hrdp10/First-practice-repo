
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>
    <link rel="stylesheet" href="assets/indexstyles.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <h1>Take a Break & Discover a new Place</h1>
        <p>Find a better place to stay, eat, shop and visit new locations</p>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-bar">
        <button class="active">Flight</button>
        <button>Hotels</button>
        <button>Packages</button>
    </nav>

    <!-- Search Section -->
    <section class="search-section">
        <input type="text" placeholder="From">
        <input type="text" placeholder="Where">
        <input type="text" placeholder="DD/MM/YY">
        <input type="number" value="1">
    </section>

    <!-- Info Section -->
    <section class="info-section">
        <div class="info-box">
            <h2>01 <span>Travel</span></h2>
            <p>A small river named Duden flows by their place and supplies it with the necessary regillia.</p>
        </div>
        <div class="info-box">
            <h2>02 <span>Experience</span></h2>
        </div>
        <div class="info-box">
            <h2>03 <span>Relax</span></h2>
        </div>
    </section>

</body>
</html>
